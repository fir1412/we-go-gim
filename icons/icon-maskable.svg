<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- we go gim app icon: a tuxedo kitten standing, looking down at the two dumbbells it holds. Full-bleed version for maskable and iOS icons. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB870"/><stop offset=".55" stop-color="#FF7F32"/><stop offset="1" stop-color="#E24E16"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".2" r=".8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".38"/><stop offset=".6" stop-color="#FFFFFF" stop-opacity=".05"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fur" cx=".38" cy=".3" r=".8">
      <stop offset="0" stop-color="#5C616E"/><stop offset=".45" stop-color="#30333C"/><stop offset="1" stop-color="#15161B"/>
    </radialGradient>
    <radialGradient id="head" cx=".38" cy=".3" r=".78">
      <stop offset="0" stop-color="#626775"/><stop offset=".5" stop-color="#33363F"/><stop offset="1" stop-color="#16171C"/>
    </radialGradient>
    <linearGradient id="limb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17181D"/><stop offset=".5" stop-color="#40444F"/><stop offset="1" stop-color="#17181D"/>
    </linearGradient>
    <radialGradient id="belly" cx=".5" cy=".4" r=".6">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFF1E0"/>
    </radialGradient>
    <radialGradient id="sock" cx=".4" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DDE1EA"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFEFF"/><stop offset=".4" stop-color="#D5DAE3"/><stop offset=".55" stop-color="#8A92A3"/><stop offset="1" stop-color="#E8EBF1"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2A2E39"/><stop offset=".45" stop-color="#4E5566"/><stop offset="1" stop-color="#1A1D25"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#7A2600" flood-opacity=".38"/>
    </filter>
    <!-- one dumbbell, centred on 0,0, handle horizontal -->
    <g id="db">
      <rect x="-34" y="-6" width="68" height="12" rx="6" fill="url(#metal)"/>
      <rect x="-50" y="-26" width="18" height="52" rx="7" fill="url(#plate)"/>
      <rect x="-60" y="-19" width="12" height="38" rx="5" fill="url(#plate)"/>
      <rect x="32" y="-26" width="18" height="52" rx="7" fill="url(#plate)"/>
      <rect x="48" y="-19" width="12" height="38" rx="5" fill="url(#plate)"/>
      <rect x="-48" y="-22" width="4" height="44" rx="2" fill="#FFFFFF" opacity=".25"/>
      <rect x="34" y="-22" width="4" height="44" rx="2" fill="#FFFFFF" opacity=".25"/>
    </g>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <g transform="translate(256 262) scale(.86) translate(-256 -262)">
    <!-- floor shadow -->
    <ellipse cx="256" cy="462" rx="120" ry="14" fill="#6E2200" opacity=".25"/>

    <g filter="url(#soft)">
      <!-- tail -->
      <path d="M318,430 C372,430 408,396 404,352 C401,322 380,312 368,326" fill="none" stroke="#22242B" stroke-width="26" stroke-linecap="round"/>
      <path d="M392,348 C396,340 398,334 396,326" fill="none" stroke="#5C616E" stroke-width="7" stroke-linecap="round" opacity=".7"/>

      <!-- body and belly -->
      <ellipse cx="256" cy="352" rx="92" ry="98" fill="url(#fur)"/>
      <ellipse cx="256" cy="366" rx="54" ry="70" fill="url(#belly)"/>

      <!-- hind feet -->
      <ellipse cx="212" cy="444" rx="38" ry="19" fill="url(#sock)"/>
      <ellipse cx="300" cy="444" rx="38" ry="19" fill="url(#sock)"/>
      <path d="M196,450 v-8 M210,452 v-9 M224,450 v-8 M288,450 v-8 M302,452 v-9 M316,450 v-8" stroke="#AEB4C2" stroke-width="3" stroke-linecap="round" opacity=".8"/>

      <!-- arms hanging down to the dumbbells -->
      <path d="M196,300 C182,322 174,350 170,384" fill="none" stroke="url(#limb)" stroke-width="36" stroke-linecap="round"/>
      <path d="M316,300 C330,322 338,350 342,384" fill="none" stroke="url(#limb)" stroke-width="36" stroke-linecap="round"/>

      <!-- dumbbells, then the paws gripping the handles -->
      <use href="#db" transform="translate(168 398) rotate(-8)"/>
      <use href="#db" transform="translate(344 398) rotate(8)"/>
      <circle cx="169" cy="394" r="19" fill="url(#sock)"/>
      <circle cx="343" cy="394" r="19" fill="url(#sock)"/>
      <path d="M160,404 v-6 M169,406 v-7 M178,404 v-6 M334,404 v-6 M343,406 v-7 M352,404 v-6" stroke="#AEB4C2" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>

      <!-- ears -->
      <path d="M168,150 C164,112 170,76 184,56 C206,76 226,100 236,122 Z" fill="url(#head)"/>
      <path d="M344,150 C348,112 342,76 328,56 C306,76 286,100 276,122 Z" fill="url(#head)"/>
      <path d="M180,136 C178,110 182,88 190,74 C204,90 216,106 222,120 Z" fill="#F7A6A0"/>
      <path d="M332,136 C334,110 330,88 322,74 C308,90 296,106 290,120 Z" fill="#F7A6A0"/>

      <!-- head, tilted a little forward -->
      <ellipse cx="256" cy="196" rx="106" ry="96" fill="url(#head)"/>
      <!-- cheek fluff -->
      <path d="M152,214 C144,226 146,238 156,242 C154,252 164,260 174,254" fill="url(#head)"/>
      <path d="M360,214 C368,226 366,238 356,242 C358,252 348,260 338,254" fill="url(#head)"/>
      <!-- tuxedo blaze down the face and white muzzle -->
      <path d="M256,150 C249,172 245,196 244,220 C226,228 216,244 223,258 C233,274 279,274 289,258 C296,244 286,228 268,220 C267,196 263,172 256,150 Z" fill="url(#sock)"/>

      <!-- eyes looking down: pupils low in each eye, upper lids half closed -->
      <ellipse cx="220" cy="216" rx="21" ry="22" fill="#C9D65B"/>
      <ellipse cx="292" cy="216" rx="21" ry="22" fill="#C9D65B"/>
      <ellipse cx="222" cy="229" rx="14" ry="11" fill="#101114"/>
      <ellipse cx="290" cy="229" rx="14" ry="11" fill="#101114"/>
      <circle cx="217" cy="226" r="4" fill="#FFFFFF"/>
      <circle cx="285" cy="226" r="4" fill="#FFFFFF"/>
      <path d="M196,218 C198,192 242,192 244,218 C234,210 206,210 196,218 Z" fill="#2C2F37"/>
      <path d="M268,218 C270,192 314,192 316,218 C306,210 278,210 268,218 Z" fill="#2C2F37"/>
      <path d="M197,217 C206,210 234,210 243,217 M269,217 C278,210 306,210 315,217" fill="none" stroke="#0B0C0F" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M200,190 C210,186 224,186 234,190 M278,190 C288,186 302,186 312,190" fill="none" stroke="#6A7080" stroke-width="4" stroke-linecap="round" opacity=".8"/>

      <!-- nose, mouth, blush, whiskers -->
      <path d="M248,246 C252,242 260,242 264,246 C261,252 258,254 256,255 C254,254 251,252 248,246 Z" fill="#F08A8A"/>
      <path d="M256,255 C254,262 247,265 241,262 M256,255 C258,262 265,265 271,262" fill="none" stroke="#6B7080" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="192" cy="240" rx="15" ry="9" fill="#FF9C8E" opacity=".25"/>
      <ellipse cx="320" cy="240" rx="15" ry="9" fill="#FF9C8E" opacity=".25"/>
      <path d="M200,246 C180,246 164,250 150,256 M202,254 C184,258 170,264 160,272 M312,246 C332,246 348,250 362,256 M310,254 C328,258 342,264 352,272" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
    </g>
  </g>
</svg>
